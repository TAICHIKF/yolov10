# Optimized YOLOv8 object detection model with P3-P5 outputs. Improved performance without increasing parameters.

# Parameters
nc: 80  # number of classes
scales:  # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]  # YOLOv8n summary: 225 layers, 3157200 parameters, 3157184 gradients, 8.9 GFLOPs

# YOLOv8n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 2, C2f, [128, True]]  # Reduced repeats for lighter computation
  - [-1, 1, Conv, [240, 3, 2]]  # 3-P3/8 (Reduced channels for balancing parameters)
  - [-1, 7, C2f, [240, True]]  # Increased repeats to improve feature extraction
  - [-1, 1, Conv, [480, 3, 2]]  # 5-P4/16 (Adjusted channels)
  - [-1, 5, C2f, [480, True]]  # Reduced repeats
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 2, C2f, [1024, True]]  # Reduced repeats
  - [-1, 1, SPPF, [1024, 5]]  # 9

# YOLOv8n head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 10
  - [[-1, 6], 1, Concat, [1]]  # 11 cat backbone P4
  - [-1, 2, C2f, [480]]  # 12 (Reduced repeats)
 
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 13
  - [[-1, 4], 1, Concat, [1]]  # 14 cat backbone P3
  - [-1, 3, C2f, [240]]  # 15 (Increased repeats for finer feature processing)
 
  - [-1, 1, Conv, [240, 3, 2]]  # 16
  - [[-1, 12], 1, Concat, [1]]  # 17 cat head P4
  - [-1, 3, C2f, [480]]  # 18 (Increased repeats for better feature refinement)
 
  - [-1, 1, Conv, [480, 3, 2]]  # 19
  - [[-1, 9], 1, Concat, [1]]  # 20 cat head P5
  - [-1, 2, C2f, [1024]]  # 21 (Reduced repeats to balance parameters)
 
  - [[15, 18, 21], 1, Detect, [nc]]  # Detect(P3, P4, P5)

#     YOLOv8n summary: 225 layers, 3,157,200 parameters, 3,157,184 gradients,  8.9 GFLOPs
#yolov8plus1 summary: 225 layers, 3,049,040 parameters, 3,049,024 gradients, 8.6 GFLOPs, 7.6764 Score
