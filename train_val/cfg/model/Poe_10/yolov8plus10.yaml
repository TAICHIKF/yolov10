# Optimized YOLOv8 object detection model with P3-P5 outputs. Improved performance without increasing parameters.

# Parameters
nc: 80  # number of classes
scales:  # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]  # YOLOv8n summary: 225 layers, 3157200 parameters, 3157184 gradients, 8.9 GFLOPs

# YOLOv8n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 4, C2f, [128, True]]  # Increased repeats for better feature extraction
  - [-1, 1, Conv, [192, 3, 2]]  # 3-P3/8 (Adjusted channels to balance parameters)
  - [-1, 12, C2f, [192, True]]  # Increased repeats for enhanced feature extraction
  - [-1, 1, Conv, [384, 3, 2]]  # 5-P4/16 (Adjusted channels)
  - [-1, 6, C2f, [384, True]]  # Increased repeats for better feature refinement
  - [-1, 1, Conv, [768, 3, 2]]  # 7-P5/32 (Adjusted channels for deeper features)
  - [-1, 6, C2f, [768, True]]  # Increased repeats for deeper features
  - [-1, 1, SPPF, [1024, 5]]  # 9

# YOLOv8n head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 10
  - [[-1, 6], 1, Concat, [1]]  # 11 cat backbone P4
  - [-1, 7, C2f, [384]]  # 12 (Increased repeats for better refinement)

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 13
  - [[-1, 4], 1, Concat, [1]]  # 14 cat backbone P3
  - [-1, 10, C2f, [192]]  # 15 (Increased repeats for finer feature processing)

  - [-1, 1, Conv, [192, 3, 2]]  # 16
  - [[-1, 12], 1, Concat, [1]]  # 17 cat head P4
  - [-1, 7, C2f, [384]]  # 18 (Balanced repeats for refinement)

  - [-1, 1, Conv, [384, 3, 2]]  # 19
  - [[-1, 9], 1, Concat, [1]]  # 20 cat head P5
  - [-1, 6, C2f, [768]]  # 21 (Adjusted channels for deeper features)

  - [[15, 18, 21], 1, Detect, [nc]]  # Detect(P3, P4, P5)

#     YOLOv8n summary: 225 layers, 3,157,200 parameters, 3,157,184 gradients,  8.9 GFLOPs
#yolov8plus10 summary: 281 layers, 2,585,584 parameters, 2,585,568 gradients, 7.7 GFLOPs, 9.0451 Score
