
# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # YOLOv12n summary: 410 layers, 2,312,919 parameters, 2,312,903 gradients, 6.8 GFLOP
  s: [0.50, 0.50, 1024] # YOLOv12s summary: 410 layers, 7,728,489 parameters, 7,728,473 gradients, 20.3 GFLOPs
  m: [0.50, 1.00, 512]  # YOLOv12m summary: 410 layers, 16,269,065 parameters, 16,269,049 gradients, 62.8 GFLOPs
  l: [1.00, 1.00, 512]  # YOLOv12l summary: 624 layers, 19,342,089 parameters, 19,342,073 gradients, 83.8 GFLOPs
  x: [1.00, 1.50, 512]  # YOLOv12x summary: 624 layers, 43,303,849 parameters, 43,303,833 gradients, 186.3 GFLOPs

backbone:
  - [-1, 1, GhostConv, [64, 3, 2]]
  - [-1, 1, GhostConv, [128, 3, 2]]
  - [-1, 2, GhostBottleneck, [256, 1, False]]
  - [-1, 1, GhostConv, [256, 3, 2]]
  - [-1, 2, GhostBottleneck, [512, 1, False]]
  - [-1, 1, GhostConv, [512, 3, 2]]
  - [-1, 2, GhostBottleneck, [512, 1, True]]
  - [-1, 1, GhostConv, [1024, 3, 2]]
  - [-1, 2, GhostBottleneck, [1024, 1, True]]
  - [-1, 1, ASPP, [1024]]
  - [-1, 1, ECAAttention, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, GhostBottleneck, [512, 1, False]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, GhostBottleneck, [256, 1, False]]

  - [-1, 1, GhostConv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, GhostBottleneck, [512, 1, False]]

  - [-1, 1, GhostConv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, GhostBottleneck, [1024, 1, True]]

  - [[16, 19, 22], 1, Detect, [nc]]

