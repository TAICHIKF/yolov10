# Optimized YOLOv8 object detection model with P3-P5 outputs. Targeting performance improvement without increasing parameters.

# Parameters
nc: 80  # number of classes
scales:
  n: [0.33, 0.25, 1024]  # YOLOv8n summary
  s: [0.33, 0.50, 1024]  # YOLOv8s summary
  m: [0.67, 0.75, 768]   # YOLOv8m summary
  l: [1.00, 1.00, 512]   # YOLOv8l summary
  x: [1.00, 1.25, 512]   # YOLOv8x summary

# Optimized YOLOv8 Backbone (with adjusted channels and fewer C2f repetitions)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]   # 1-P2/4
  - [-1, 2, C2f, [128, True]]    # Reduced from 3 to 2 C2f layers
  - [-1, 1, Conv, [256, 3, 2]]   # 3-P3/8
  - [-1, 4, C2f, [256, True]]    # Reduced from 6 to 4 C2f layers
  - [-1, 1, Conv, [512, 3, 2]]   # 5-P4/16
  - [-1, 4, C2f, [512, True]]    # Reduced from 6 to 4 C2f layers
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 2, C2f, [1024, True]]   # Reduced from 3 to 2 C2f layers
  - [-1, 1, SPPF, [1024, 5]]     # 9 (SPPF layer remains the same)

# Optimized YOLOv8 Head (improved upsampling, fewer concat layers)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]  # cat backbone P4
  - [-1, 3, C2f, [512]]        # 12 (P4/16-medium)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]  # cat backbone P3
  - [-1, 3, C2f, [256]]        # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]  # cat head P4
  - [-1, 3, C2f, [512]]        # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]   # cat head P5
  - [-1, 3, C2f, [1024]]       # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]]  # Detect(P3, P4, P5)