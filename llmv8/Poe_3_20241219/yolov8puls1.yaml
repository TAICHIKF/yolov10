
# Optimized YOLOv8 object detection model with P3-P5 outputs. Improved structure for better performance while maintaining parameter count.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024] # YOLOv8n summary: 225 layers, 3157200 parameters, 3157184 gradients, 8.9 GFLOPs

# YOLOv8n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 2, C2f, [128, True]]  # Reduced repeats from 3 to 2; improves feature efficiency
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 5, C2f, [256, True]]  # Reduced repeats from 6 to 5; balances computation
  - [-1, 1, Conv, [384, 3, 2]]  # 5-P4/16; decreased channels from 512 to 384
  - [-1, 7, C2f, [384, True]]  # Increased repeats from 6 to 7; compensates for reduced channels
  - [-1, 1, Conv, [768, 3, 2]]  # 7-P5/32; decreased channels from 1024 to 768
  - [-1, 4, C2f, [768, True]]  # Increased repeats from 3 to 4; balances reduced channels
  - [-1, 1, SPPF, [768, 5]]  # Reduced channels from 1024 to 768

# YOLOv8n head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 10
  - [[-1, 6], 1, Concat, [1]]  # cat backbone P4
  - [-1, 3, C2f, [384]]  # Reduced channels from 512 to 384
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 13
  - [[-1, 4], 1, Concat, [1]]  # cat backbone P3
  - [-1, 3, C2f, [192]]  # Reduced channels from 256 to 192
  - [-1, 1, Conv, [192, 3, 2]]  # 16
  - [[-1, 12], 1, Concat, [1]]  # cat head P4
  - [-1, 3, C2f, [384]]  # Reduced channels from 512 to 384
  - [-1, 1, Conv, [384, 3, 2]]  # 19
  - [[-1, 9], 1, Concat, [1]]  # cat head P5
  - [-1, 3, C2f, [768]]  # Reduced channels from 1024 to 768
  - [[15, 18, 21], 1, Detect, [nc]]  # Detect(P3, P4, P5)
