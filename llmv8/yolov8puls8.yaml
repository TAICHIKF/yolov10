nc: 80  # number of classes
scales:  # model compound scaling constants
  n: [0.33, 0.25, 1024]  # YOLOv8n summary: 225 layers, 3157200 parameters, 3157184 gradients, 8.9 GFLOPs

# YOLOv8n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 2, C2f, [128, True]]  # Reduced repeats from 3 -> 2
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 4, C2f, [256, True]]  # Reduced repeats from 6 -> 4
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 5, C2f, [512, True]]  # Reduced repeats from 6 -> 5
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 2, C2f, [1024, True]]  # Reduced repeats from 3 -> 2
  - [-1, 1, SPPF, [1024, 5]]  # 9

# YOLOv8n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]  # cat backbone P4
  - [-1, 2, C2f, [512]]  # Reduced repeats from 3 -> 2
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]  # cat backbone P3
  - [-1, 2, C2f, [256]]  # Reduced repeats from 3 -> 2
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]  # cat head P4
  - [-1, 2, C2f, [512]]  # Reduced repeats from 3 -> 2
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]  # cat head P5
  - [-1, 2, C2f, [1024]]  # Reduced repeats from 3 -> 2
  - [[15, 18, 21], 1, Detect, [nc]]  # Detect(P3, P4, P5)

  # YOLOv8puls8 summary: 218 layers, 3136592 parameters, 3136576 gradients, 8.6 GFLOPs