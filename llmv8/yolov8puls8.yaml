# Optimized YOLOv8 object detection model configuration
# Targeting performance improvement with parameter reduction or maintenance

# Parameters
nc: 80 # number of classes
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]

# YOLOv8n backbone
backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 4, C2f, [128, True]] # Increased repeats from 3 to 4
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 7, C2f, [256, True]] # Increased repeats from 6 to 7
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 7, C2f, [512, True]] # Increased repeats from 6 to 7
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 4, C2f, [1024, True]] # Increased repeats from 3 to 4
  - [-1, 1, SPPF, [1024, 5]]

# YOLOv8n head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]
  - [[15, 18, 21], 1, Detect, [nc]]