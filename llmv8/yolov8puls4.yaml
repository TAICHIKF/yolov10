
# Optimized YOLOv8 object detection model with P3-P5 outputs. Targeting performance improvement without increasing parameters.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants 
  n: [0.33, 0.20, 1024] # Modified YOLOv8n summary: 225 layers,  3157200 parameters,  3157184 gradients,   8.0 GFLOPs
  s: [0.33, 0.45, 1024] # Modified YOLOv8s summary: 225 layers, 11166560 parameters, 11166544 gradients,  27.5 GFLOPs
  m: [0.67, 0.70, 768] # Modified YOLOv8m summary: 295 layers, 25902640 parameters, 25902624 gradients,  78.0 GFLOPs
  l: [1.00, 0.90, 512] # Modified YOLOv8l summary: 365 layers, 43691520 parameters, 43691504 gradients, 164.5 GFLOPs
  x: [1.00, 1.10, 512] # Modified YOLOv8x summary: 365 layers, 68229648 parameters, 68229632 gradients, 256.0 GFLOPs

# YOLOv8n backbone
backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 5, C2f, [256, True]] # Reduced repeats to improve efficiency
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 5, C2f, [512, True]] # Reduced repeats to improve ef·ficiency
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
·
# YOLOv8n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f, [512]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f, [256]] # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P4
  - [-1, 2, C2f, [512]] # 18 (P4/16-medium) Reduced to improve performance without increasing params

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]] # cat head P5
  - [-1, 2, C2f, [1024]] # 21 (P5/32-large) Reduced to improve performance without increasing params

  - [[15, 18, 21], 1, Detect, [nc]] # Detect(P3, P4, P5)

# YOLOv8puls4 summary: 225 layers, 2311888 parameters, 2311872 gradients, 7.2 GFLOPs