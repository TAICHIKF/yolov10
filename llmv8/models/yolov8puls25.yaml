
# Optimized YOLOv8 object detection model with P3-P5 outputs. Improved detection performance without increasing parameters.

# Parameters
nc: 80  # number of classes
scales:  # model compound scaling constants
  n: [0.33, 0.25, 1024]  # Adjusted to maintain parameter constraints

# YOLOv8n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 4, C2f, [128, True]]  # Increased repeats from 3 to 4 for better feature extraction
  - [-1, 1, Conv, [224, 3, 2]]  # Reduced channels from 256 to 224 to balance parameters
  - [-1, 8, C2f, [224, True]]  # Increased repeats from 6 to 8 for deeper feature extraction
  - [-1, 1, Conv, [512, 3, 2]]  # Maintained same output channels
  - [-1, 5, C2f, [512, True]]  # Reduced repeats from 6 to 5 to balance parameters
  - [-1, 1, Conv, [896, 3, 2]]  # Reduced channels from 1024 to 896 to balance parameters
  - [-1, 4, C2f, [896, True]]  # Increased repeats from 3 to 4 for stronger feature learning
  - [-1, 1, SPPF, [896, 5]]  # Reduced channels from 1024 to 896 to balance parameters

# YOLOv8n head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 10
  - [[-1, 6], 1, Concat, [1]]  # cat backbone P4
  - [-1, 3, C2f, [448]]  # Reduced channels from 512 to 448
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 13
  - [[-1, 4], 1, Concat, [1]]  # cat backbone P3
  - [-1, 4, C2f, [192]]  # Increased repeats from 3 to 4, reduced channels from 256 to 192
  - [-1, 1, Conv, [192, 3, 2]]  # Reduced channels from 256 to 192
  - [[-1, 12], 1, Concat, [1]]  # cat head P4
  - [-1, 4, C2f, [448]]  # Increased repeats from 3 to 4, reduced channels from 512 to 448
  - [-1, 1, Conv, [448, 3, 2]]  # Reduced channels from 512 to 448
  - [[-1, 9], 1, Concat, [1]]  # cat head P5
  - [-1, 4, C2f, [896]]  # Increased repeats from 3 to 4, reduced channels from 1024 to 896
  - [[15, 18, 21], 1, Detect, [nc]]  # Detect(P3, P4, P5)
