# Optimized YOLOv8 object detection model with P3-P5 outputs.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024] 

# YOLOv8n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [48, 3, 2]]  
  - [-1, 1, Conv, [96, 3, 2]]  
  - [-1, 3, C2f, [96, True]] 
  - [-1, 1, Conv, [192, 3, 2]]  
  - [-1, 6, C2f, [192, True]] 
  - [-1, 1, Conv, [384, 3, 2]]  
  - [-1, 6, C2f, [384, True]] 
  - [-1, 1, Conv, [768, 3, 2]]  
  - [-1, 3, C2f, [768, True]] 
  - [-1, 1, SPPF, [768, 5]]  

# YOLOv8n head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] 
  - [[-1, 6], 1, Concat, [1]]  
  - [-1, 3, C2f, [384]]  
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] 
  - [[-1, 4], 1, Concat, [1]]  
  - [-1, 3, C2f, [192]]  
  - [-1, 1, Conv, [192, 3, 2]] 
  - [[-1, 12], 1, Concat, [1]]  
  - [-1, 3, C2f, [384]]  
  - [-1, 1, Conv, [384, 3, 2]] 
  - [[-1, 9], 1, Concat, [1]]  
  - [-1, 3, C2f, [768]]  
  - [[15, 18, 21], 1, Detect, [nc]]