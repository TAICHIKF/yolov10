
# Optimized YOLOv8 object detection model with P3-P5 outputs. Improved target detection performance without increasing parameters.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  n: [0.30, 0.28, 1024] # Adjusted: Slightly decreased depth, increased width for better feature extraction

# YOLOv8n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [48, 3, 2]]  # Reduced initial channels to save parameters
  - [-1, 1, Conv, [128, 3, 2]]  
  - [-1, 4, C2f, [128, True]] # Increased repeats for better feature learning
  - [-1, 1, Conv, [192, 3, 2]]  # Reduced channels to balance parameters
  - [-1, 5, C2f, [192, True]] # Adjusted repeats for balance
  - [-1, 1, Conv, [384, 3, 2]]  
  - [-1, 5, C2f, [384, True]] 
  - [-1, 1, Conv, [768, 3, 2]]  # Reduced channels slightly
  - [-1, 4, C2f, [768, True]] # Adjusted repeats
  - [-1, 1, SPPF, [768, 5]]  # Reduced output channels of SPPF

# YOLOv8n head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]  # cat backbone P4
  - [-1, 4, C2f, [384]]  # Adjusted channels and repeats
  
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]  # cat backbone P3
  - [-1, 4, C2f, [192]]  # Adjusted channels and repeats

  - [-1, 1, Conv, [192, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]  # cat head P4
  - [-1, 4, C2f, [384]]  # Adjusted channels and repeats

  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]  # cat head P5
  - [-1, 3, C2f, [768]]  # Adjusted channels and repeats

  - [[15, 18, 21], 1, Detect, [nc]]  # Detect(P3, P4, P5)


# YOLOv8puls11 summary: 225 layers, 2491768 parameters, 2491752 gradients, 7.9 GFLOPs