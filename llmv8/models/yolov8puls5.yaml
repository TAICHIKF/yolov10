
# Optimized YOLOv8 model configuration with improved performance and unchanged parameter count.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  n: [0.35, 0.25, 1024] # slightly increased depth for performance enhancement

# YOLOv8n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [240, 3, 2]] # 3-P3/8
  - [-1, 4, C2f, [240, True]] # Reduced repeats, adjusted channels
  - [-1, 1, Conv, [480, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [480, True]] # Reduced channels
  - [-1, 1, Conv, [960, 3, 2]] # 7-P5/32
  - [-1, 2, C2f, [960, True]] # Reduced repeats for efficiency
  - [-1, 1, SPPF, [960, 5]] # Adjusted channels

# YOLOv8n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C2f, [480]] # Adjusted channels, reduced repeats

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C2f, [240]] # 15 (P3/8-small)

  - [-1, 1, Conv, [240, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P4
  - [-1, 2, C2f, [480]] # 18 (P4/16-medium)

  - [-1, 1, Conv, [480, 3, 2]]
  - [[-1, 9], 1, Concat, [1]] # cat head P5
  - [-1, 2, C2f, [960]] # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]] # Detect(P3, P4, P5)


  # YOLOv8puls5 summary: 218 layers, 2855360 parameters, 2855344 gradients, 8.2 GFLOP
