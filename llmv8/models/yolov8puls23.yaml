
# Optimized YOLOv8 object detection model with P3-P5 outputs. Performance improved without increasing parameters.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.40, 0.23, 1024] # Adjusted depth and width scaling to balance layers and channels

# YOLOv8n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [48, 3, 2]]  # Reduced initial channel size for better efficiency
  - [-1, 1, Conv, [96, 3, 2]]  
  - [-1, 4, C2f, [96, True]]  # Increased repeats for C2f to improve feature extraction
  - [-1, 1, Conv, [192, 3, 2]]  
  - [-1, 5, C2f, [192, True]]  # Increased depth here while reducing channels slightly
  - [-1, 1, Conv, [384, 3, 2]]  
  - [-1, 5, C2f, [384, True]]  # Balanced channels and repeats for efficiency
  - [-1, 1, Conv, [768, 3, 2]]  
  - [-1, 2, C2f, [768, True]]  # Reduced repeats to limit parameter increase
  - [-1, 1, SPPF, [768, 5]]  # Reduced output channels in SPPF for lower computational cost

# YOLOv8n head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  
  - [[-1, 6], 1, Concat, [1]]  # cat backbone P4
  - [-1, 3, C2f, [384]]  # Adjusted channels for balance

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  
  - [[-1, 4], 1, Concat, [1]]  # cat backbone P3
  - [-1, 3, C2f, [192]]  # Adjusted channels for balance

  - [-1, 1, Conv, [192, 3, 2]]  
  - [[-1, 12], 1, Concat, [1]]  # cat head P4
  - [-1, 3, C2f, [384]]  # Adjusted channels for balance

  - [-1, 1, Conv, [384, 3, 2]]  
  - [[-1, 9], 1, Concat, [1]]  # cat head P5
  - [-1, 3, C2f, [768]]  # Adjusted depth and channels for better detection

  - [[15, 18, 21], 1, Detect, [nc]]  # Detect(P3, P4, P5)


# YOLOv8puls23 summary: 232 layers, 1960568 parameters, 1960552 gradients, 6.3 GFLOPs