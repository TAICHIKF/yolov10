
# Optimized YOLOv8 object detection model with P3-P5 outputs. Improved performance without increasing parameters.

# Parameters
nc: 80  # number of classes
scales:  # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.40, 0.23, 1024]  # Adjusted scaling: slightly deeper with reduced width

# Optimized YOLOv8n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [48, 3, 2]]  # Reduced initial channels to 48
  - [-1, 1, Conv, [128, 3, 2]]  
  - [-1, 4, C2f, [128, False]]  # Increased repeats to 4, removed shortcut for better gradient flow
  - [-1, 1, Conv, [240, 3, 2]]  # Reduced channels to 240
  - [-1, 5, C2f, [240, True]]  # Decreased repeats to 5 for reduced channels
  - [-1, 1, Conv, [480, 3, 2]]  # Adjusted channels to 480
  - [-1, 5, C2f, [480, True]]  # Decreased repeats to 5 for reduced channels
  - [-1, 1, Conv, [1024, 3, 2]]  
  - [-1, 2, C2f, [1024, True]]  # Reduced repeats to 2 for efficiency
  - [-1, 1, SPPF, [1024, 5]]  

# Optimized YOLOv8n head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]  
  - [-1, 4, C2f, [384]]  # Decreased channels to 384
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 4, C2f, [192]]  # Reduced channels to 192
  - [-1, 1, Conv, [192, 3, 2]]  
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 4, C2f, [384]]  # Adjusted channels to match P4
  - [-1, 1, Conv, [384, 3, 2]]  
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 2, C2f, [768]]  # Reduced repeats to 2 for P5
  - [[15, 18, 21], 1, Detect, [nc]]  # Detect(P3, P4, P5)


# YOLOv8puls26 summary: 253 layers, 2468960 parameters, 2468944 gradients, 7.8 GFLOPs