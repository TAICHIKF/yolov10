
# Optimized YOLOv8 object detection model with P3-P5 outputs. Improved efficiency through architectural modifications.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  n: [0.28, 0.3, 960] # Adjusted scale: Reduced depth, increased width

# YOLOv8n backbone
backbone:
  - [-1, 1, Conv, [72, 3, 2]]  # Adjusted channels for Conv layers accordingly
  - [-1, 1, Conv, [144, 3, 2]]
  - [-1, 2, C2f, [144, False]] # Reduced repeats and adjusted shortcut option
  - [-1, 1, Conv, [240, 3, 2]]
  - [-1, 5, C2f, [240, False]]
  - [-1, 1, Conv, [480, 3, 2]]
  - [-1, 5, C2f, [480, False]]
  - [-1, 1, Conv, [960, 3, 2]]
  - [-1, 2, C2f, [960, False]]
  - [-1, 1, SPPF, [960, 5]]

# YOLOv8n head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C2f, [480]]  # Adjusted repetition
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C2f, [240]]
  - [-1, 1, Conv, [240, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 2, C2f, [480]]
  - [-1, 1, Conv, [480, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 2, C2f, [960]]
  - [[15, 18, 21], 1, Detect, [nc]]  # Predict output


  # YOLOv8puls7 summary: 211 layers, 3718264 parameters, 3718248 gradients, 10.5 GFLOPs
