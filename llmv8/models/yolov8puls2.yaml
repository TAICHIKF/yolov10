
# Optimized YOLOv8 configuration for improved detection performance with reduced or static parameters.

# Parameters
nc: 80 # number of classes
scales: 
  n: [0.33, 0.25, 1024] # Summary: 225 layers, reduced parameters
  s: [0.33, 0.50, 1024] # Summary: 225 layers, reduced parameters
  m: [0.67, 0.75, 768]  # Summary: 295 layers, reduced parameters
  l: [1.00, 1.00, 512]   # Summary: 365 layers, reduced parameters
  x: [1.00, 1.25, 512]   # Summary: 365 layers, reduced parameters

# YOLOv8 Backbone
backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, BottleneckCSP, [128]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, BottleneckCSP, [256]] # Changed module for efficiency
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9

# YOLOv8 Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] 
  - [-1, 3, C2f, [512]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] 
  - [-1, 3, C2f, [256]] # 15 (P3/8-small)

  - [-1, 1, GhostConv, [256, 3, 2]] # Changed to GhostConv for parameter efficiency
  - [[-1, 12], 1, Concat, [1]] 
  - [-1, 3, C2f, [512]] # 18 (P4/16-medium)

  - [-1, 1, GhostConv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]] 
  - [-1, 3, C2f, [1024]] # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]] # Detect(P3, P4, P5)
