
# Optimized YOLOv8 object detection model with P3-P5 outputs. Improved configuration targeting performance enhancement without increasing parameters.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024] # Optimized YOLOv8n summary: 230 layers, 3157200 parameters, 3157184 gradients, 8.9 GFLOPs

# YOLOv8n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 4, C2f, [128, True]]  # Increased depth for better feature extraction
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 5, C2f, [192, True]]  # Reduced channels, increased depth for efficiency
  - [-1, 1, Conv, [384, 3, 2]]  # 5-P4/16
  - [-1, 6, C2f, [384, True]]  # Balanced depth and channel width
  - [-1, 1, Conv, [768, 3, 2]]  # 7-P5/32
  - [-1, 4, C2f, [768, True]]  # Increased depth for high-level features
  - [-1, 1, SPPF, [768, 5]]  # Reduced channels for efficiency

# YOLOv8n head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 10
  - [[-1, 6], 1, Concat, [1]]  # cat backbone P4
  - [-1, 3, C2f, [384]]  # Adjusted channel width
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 13
  - [[-1, 4], 1, Concat, [1]]  # cat backbone P3
  - [-1, 3, C2f, [192]]  # Adjusted channel width for compatibility
  
  - [-1, 1, Conv, [192, 3, 2]]  # 16
  - [[-1, 12], 1, Concat, [1]]  # cat head P4
  - [-1, 3, C2f, [384]]  # Adjusted channel width
  
  - [-1, 1, Conv, [384, 3, 2]]  # 19
  - [[-1, 9], 1, Concat, [1]]  # cat head P5
  - [-1, 3, C2f, [768]]  # Adjusted channel width for final detection layers
  
  - [[15, 18, 21], 1, Detect, [nc]]  # Detect(P3, P4, P5)


  # YOLOv8puls10 summary: 225 layers, 2039440 parameters, 2039424 gradients, 6.6 GFLOPs
