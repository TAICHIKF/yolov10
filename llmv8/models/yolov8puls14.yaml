
# Optimized YOLOv8 object detection model with P3-P5 outputs. Enhanced performance with same or fewer parameters.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.40, 0.22, 1024] # Adjusted scaling: slightly increased depth, reduced width for parameter balance.

# YOLOv8n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [48, 3, 2]]  # Reduced initial channel count to 48 for better efficiency
  - [-1, 1, Conv, [96, 3, 2]]  # Adjusted channel count
  - [-1, 4, C2f, [96, True]]  # Increased depth in C2f module
  - [-1, 1, Conv, [192, 3, 2]]  # Adjusted channel count
  - [-1, 6, C2f, [192, True]]  # Reduced width in C2f module, increased depth
  - [-1, 1, Conv, [384, 3, 2]]  # Adjusted channel count
  - [-1, 5, C2f, [384, True]]  # Reduced repeats for parameter balancing
  - [-1, 1, Conv, [768, 3, 2]]  # Adjusted channel count
  - [-1, 3, C2f, [768, True]]  # Reduced width for parameter efficiency
  - [-1, 1, SPPF, [768, 5]]  # Reduced SPPF output channel count

# YOLOv8n head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]  # cat backbone P4
  - [-1, 3, C2f, [384]]  # Adjusted channel count in head C2f
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]  # cat backbone P3
  - [-1, 3, C2f, [192]]  # Adjusted channel count in head C2f
  - [-1, 1, Conv, [192, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]  # cat head P4
  - [-1, 3, C2f, [384]]  # Adjusted channel count in head C2f
  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]  # cat head P5
  - [-1, 3, C2f, [768]]  # Adjusted channel count in head C2f
  - [[15, 18, 21], 1, Detect, [nc]]  # Detect(P3, P4, P5)


# YOLOv8puls14 summary: 232 layers, 1812304 parameters, 1812288 gradients, 6.1 GFLOPs