
# Optimized YOLOv8 object detection model with P3-P5 outputs. Improved performance without increasing parameters.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.40, 0.22, 1024] # Adjusted scaling: depth increased, width decreased to balance parameters

# YOLOv8n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [48, 3, 2]]  # Reduced initial channels for efficiency
  - [-1, 1, Conv, [96, 3, 2]]  # Adjusted channels for gradual increase
  - [-1, 4, C2f, [96, True]]  # Increased repeats for better feature extraction
  - [-1, 1, Conv, [192, 3, 2]]  # Adjusted channel size
  - [-1, 6, C2f, [192, True]]  # Reduced channels, kept repeats for balance
  - [-1, 1, Conv, [384, 3, 2]]  # Increased channels for deeper features
  - [-1, 5, C2f, [384, True]]  # Reduced repeats to balance parameters
  - [-1, 1, Conv, [768, 3, 2]]  # Adjusted channels for P5
  - [-1, 4, C2f, [768, True]]  # Increased depth for stronger feature extraction
  - [-1, 1, SPPF, [768, 5]]  # Reduced channels in SPPF to maintain parameter count

# YOLOv8n head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # Upsample P5
  - [[-1, 6], 1, Concat, [1]]  # Concat with backbone P4
  - [-1, 3, C2f, [384]]  # Reduced channels in head for efficiency

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # Upsample P4
  - [[-1, 4], 1, Concat, [1]]  # Concat with backbone P3
  - [-1, 3, C2f, [192]]  # Reduced channels in P3 for balance

  - [-1, 1, Conv, [192, 3, 2]] # Downsample P3
  - [[-1, 12], 1, Concat, [1]]  # Concat with head P4
  - [-1, 3, C2f, [384]]  # P4 refinement

  - [-1, 1, Conv, [384, 3, 2]] # Downsample P4
  - [[-1, 9], 1, Concat, [1]]  # Concat with head P5
  - [-1, 3, C2f, [768]]  # P5 refinement

  - [[15, 18, 21], 1, Detect, [nc]]  # Detect(P3, P4, P5)
