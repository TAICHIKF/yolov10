
# Optimized YOLOv8 object detection model with P3-P5 outputs. Targeting performance improvement without increasing parameters.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  n: [0.3, 0.2, 1024] # Modified scale to maintain parameter count

# YOLOv8n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [48, 3, 2]]  # Reduced channels to adjust depth
  - [-1, 1, Conv, [96, 3, 2]]
  - [-1, 4, C2f, [96, True]] # Increased repeats to improve representation
  - [-1, 1, Conv, [192, 3, 2]]
  - [-1, 5, C2f, [192, True]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 5, C2f, [384, True]]
  - [-1, 1, Conv, [768, 3, 2]]
  - [-1, 4, C2f, [768, True]]
  - [-1, 1, SPPF, [768, 5]]

# YOLOv8n head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 5], 1, Concat, [1]]  # Adjusted layer index due to changes in backbone
  - [-1, 4, C2f, [384]]
 
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 4, C2f, [192]]
 
  - [-1, 1, Conv, [192, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 4, C2f, [384]]
 
  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 4, C2f, [768]]
 
  - [[12, 14, 16], 1, Detect, [nc]]



  # YOLOv8puls6 summary: 225 layers, 1523840 parameters, 1523824 gradients, 6.8 GFLOPs
